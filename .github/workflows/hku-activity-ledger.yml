name: HKU public activity ledger (review artifact)

# Deliberately manual: run monthly when needed. No automatic public publication.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Window end (YYYY-MM-DD); leave blank for the current Hong Kong day'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hku-activity-ledger
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the bounded collector
        run: python -m pip install -r requirements-ledger.txt
      - name: Test parsers and failure safety
        run: python -m unittest discover -s tests -v
      - name: Collect a 60-day source snapshot
        env:
          LEDGER_AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          ledger_args=()
          if [[ -n "$LEDGER_AS_OF" ]]; then
            ledger_args+=(--as-of "$LEDGER_AS_OF")
          fi
          python scripts/ingest_hku_activity.py "${ledger_args[@]}"
      - name: Save the reviewable report (does not deploy)
        uses: actions/upload-artifact@v4
        with:
          name: hku-public-activity-${{ github.run_number }}
          path: |
            public/internal/hku-activity/
            data/hku-activity/last-attempt.json
          retention-days: 31
          if-no-files-found: error
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hku-public-activity-failure-${{ github.run_number }}
          path: data/hku-activity/last-attempt.json
          retention-days: 14
          if-no-files-found: ignore
